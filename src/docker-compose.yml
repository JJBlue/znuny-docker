# One compose project per instance (otherwise a second instance would take over
# the containers, volumes and network of the first one).
name: znuny-${ZNUNY_INSTANCE}

secrets:
  db_password:
    file: ./secrets/db_password_${ZNUNY_INSTANCE}
  znuny_admin_password:
    file: ./secrets/znuny_admin_password_${ZNUNY_INSTANCE}

networks:
  znuny-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "znuny-${ZNUNY_INSTANCE}"

volumes:
  LinuxTruststore:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/os/ca-certificates
  ZnunyApp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/instances/${ZNUNY_INSTANCE}/app
  ZnunyPersistent:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/instances/${ZNUNY_INSTANCE}/persistent
  ZnunyLog:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/instances/${ZNUNY_INSTANCE}/log
  ZnunyArticle:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/instances/${ZNUNY_INSTANCE}/article
  ZnunyHTDocs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/instances/${ZNUNY_INSTANCE}/htdocs_custom
  ZnunySMIME:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/instances/${ZNUNY_INSTANCE}/smime

services:
  znuny-httpd:
    image: znuny-httpd:${ZNUNY_VERSION}
    pull_policy: never
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.znuny
      target: httpd
      args:
        ZNUNY_VERSION: ${ZNUNY_VERSION}
        ZNUNY_CHECKSUM: ${ZNUNY_CHECKSUM}
        ZNUNY_SIGNATURE: ${ZNUNY_SIGNATURE}
        ZNUNY_DEFAULT_INTERFACE: ${ZNUNY_DEFAULT_INTERFACE}
    container_name: znuny_httpd_${ZNUNY_INSTANCE}
    init: true
    mem_limit: ${HTTPD_MEMLIMIT:-1024m}
    cpus: ${HTTPD_CPUS:-2}
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - znuny-net
    secrets:
      - db_password
      - znuny_admin_password
    environment:
      DB_HOST: ${DB_HOST:-znuny-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-znuny}
      DB_USER: ${DB_USER:-znuny}
      WEB_PORT: ${WEB_PORT:-80}
      ZNUNY_NodeID: ${ZNUNY_NodeID:-1}
      ZNUNY_DEFAULT_INTERFACE: ${ZNUNY_DEFAULT_INTERFACE:-agent}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/znuny/index.pl", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 300s
    volumes:
      - LinuxTruststore:/usr/local/share/ca-certificates
      - ZnunyApp:/opt/znuny
      - ZnunyLog:/opt/znuny/var/log
      - ZnunyArticle:/opt/znuny/var/article
      - ZnunyHTDocs:/opt/znuny/var/httpd/htdocs/custom
      - ZnunyPersistent:/persistent
      - ZnunySMIME:/opt/znuny_volumes/smime