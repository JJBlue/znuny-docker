secrets:
  db_password:
    file: ./secrets/db_password_${ZNUNY_INSTANCE}
  znuny_admin_password:
    file: ./secrets/znuny_admin_password_${ZNUNY_INSTANCE}

networks:
  znuny-net:
    driver: bridge

volumes:
  Znuny:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/${ZNUNY_INSTANCE}/znuny
  ZnunyPersistent:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/${ZNUNY_INSTANCE}/persistent
  ZnunyLog:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/${ZNUNY_INSTANCE}/log
  ZnunyArticle:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/${ZNUNY_INSTANCE}/article
  ZnunyHTDocs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ZNUNY_PERSISTENT_FOLDER}/${ZNUNY_INSTANCE}/htdocs_custom

services:
  znuny-httpd:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.znuny
      target: httpd
      args:
        ZNUNY_VERSION: ${ZNUNY_VERSION}
        ZNUNY_CHECKSUM: ${ZNUNY_CHECKSUM}
        ZNUNY_SIGNATURE: ${ZNUNY_SIGNATURE}
        ZNUNY_DEFAULT_INTERFACE: ${ZNUNY_DEFAULT_INTERFACE}
    container_name: znuny_httpd_${ZNUNY_INSTANCE}
    mem_limit: ${HTTPD_MEMLIMIT:-1024m}
    cpus: ${HTTPD_CPUS:-2}
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - znuny-net
    secrets:
      - db_password
      - znuny_admin_password
    environment:
      DB_HOST: ${DB_HOST:-znuny-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-znuny}
      DB_USER: ${DB_USER:-znuny}
      WEB_PORT: ${WEB_PORT:-80}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/znuny/index.pl", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 300s
    volumes:
      - Znuny:/opt/znuny
      - ZnunyLog:/opt/znuny/var/log
      - ZnunyArticle:/opt/znuny/var/article
      - ZnunyHTDocs:/opt/znuny/var/httpd/htdocs/custom
      - ZnunyPersistent:/persistent