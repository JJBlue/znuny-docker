services:
  znuny-daemon:
    image: znuny-daemon:${ZNUNY_VERSION}
    pull_policy: never
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.znuny
      target: daemon
      args:
        ZNUNY_VERSION: ${ZNUNY_VERSION}
        ZNUNY_CHECKSUM: ${ZNUNY_CHECKSUM}
        ZNUNY_SIGNATURE: ${ZNUNY_SIGNATURE}
    container_name: znuny_daemon_${ZNUNY_INSTANCE}
    mem_limit: ${DAEMON_MEMLIMIT:-2048m}
    cpus: ${DAEMON_CPUS:-2}
    depends_on:
      znuny-httpd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "gosu", "znuny", "/opt/znuny/bin/znuny.Daemon.pl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - znuny-net
    secrets:
      - db_password
    environment:
      DB_HOST: ${DB_HOST:-znuny-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-znuny}
      DB_USER: ${DB_USER:-znuny}
      ZNUNY_NodeID: ${ZNUNY_NodeID:-1}
    restart: unless-stopped
    volumes:
      - LinuxTruststore:/usr/local/share/ca-certificates
      - ZnunyApp:/opt/znuny
      - ZnunyLog:/opt/znuny/var/log
      - ZnunyArticle:/opt/znuny/var/article
      - ZnunyHTDocs:/opt/znuny/var/httpd/htdocs/custom
      - ZnunyPersistent:/persistent
      - ZnunySMIME:/opt/znuny_volumes/smime