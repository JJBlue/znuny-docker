secrets:
  db_root_password:
    file: ./secrets/db_root_password

volumes:
  MariaDBVol:

services:
  znuny-daemon:
    depends_on:
      znuny-db:
        condition: service_healthy

  znuny-httpd:
    depends_on:
      znuny-db:
        condition: service_healthy

  znuny-db:
    image: mariadb:${MARIADB_VERSION:-latest}
    container_name: znuny_db
    mem_limit: ${DB_MEMLIMIT:-2048m}
    cpus: ${DB_CPUS:-2}
    secrets:
      - db_root_password
      - db_password
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${DB_NAME:-znuny}
      MYSQL_USER: ${DB_USER:-znuny}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - MariaDBVol:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - znuny-net
    command: [
      "--max_allowed_packet=256M",
      "--innodb_log_file_size=512M"
    ]
    labels:
      org.label-schema.group: "znuny"
    # ---- Security hardening ----
    read_only: true          # root FS is read-only; data goes on volumes
    tmpfs:
      - /tmp                 # MariaDB needs a writable /tmp
      - /var/run/mysqld      # is a symlink to /run
      - /run/mysqld          # socket directory
    cap_drop:                # Drop all capabilities
      - ALL
    cap_add:                 # Add needed for MariaDB.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
